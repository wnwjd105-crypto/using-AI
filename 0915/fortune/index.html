<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 원소 운세</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-group label {
            font-weight: normal;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #3498db;
            border-radius: 4px;
            display: none;
        }
        #result h3 {
            margin-bottom: 8px;
            color: #2c3e50;
            font-size: 16px;
        }
        #result p {
            font-size: 14px;
            line-height: 1.5;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>원소별 오늘의 운세</h2>
        <form id="fortuneForm">
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" required placeholder="이름을 입력하세요">
            </div>

            <div class="form-group">
                <label for="birth">생일</label>
                <input type="date" id="birth" required>
            </div>

            <div class="form-group">
                <label>성별</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="남성" required> 남성</label>
                    <label><input type="radio" name="gender" value="여성" required> 여성</label>
                    <label><input type="radio" name="gender" value="기타" required> 기타</label>
                </div>
            </div>

            <div class="form-group">
                <label for="element">원소 선택</label>
                <select id="element" required>
                    <option value="" disabled selected>원소를 선택하세요</option>
                    <option value="불">불 (Fire)</option>
                    <option value="물">물 (Water)</option>
                    <option value="나무">나무 (Wood)</option>
                    <option value="땅">땅 (Earth)</option>
                    <option value="바람">바람 (Wind)</option>
                </select>
            </div>

            <button type="submit">운세 확인하기</button>
        </form>

        <div id="result">
            <h3 id="resultTitle"></h3>
            <p id="resultText"></p>
        </div>
    </div>

    <script>
        const fortunes = {
            "불": [
                "열정이 최고조에 달하는 하루입니다. 밀어붙이던 일이 있다면 오늘 과감히 시도해 보세요.",
                "사소한 일에 화를 내거나 조급해질 수 있습니다. 깊게 숨을 쉬고 마음의 안정을 찾으세요.",
                "당신의 뜨거운 에너지가 주변 사람들에게 큰 영감을 주는 날입니다."
            ],
            "물": [
                "흐름에 자연스럽게 몸을 맡기면 뜻밖의 행운이 찾아오는 유연한 하루입니다.",
                "감정 기복이 생길 수 있으니 중요한 결정을 내리기보다는 내면을 돌보는 데 집중하세요.",
                "주변의 고민을 깊이 공감해 주어 소중한 인연으로부터 신뢰를 얻게 됩니다."
            ],
            "나무": [
                "꾸준히 공들여온 일에서 서서히 싹이 트기 시작하는 보람찬 하루입니다.",
                "고집을 조금만 내려놓는다면 주변의 조언이 큰 성장의 거름이 될 것입니다.",
                "재물운과 학습운이 상승하여 계획했던 바를 차근차근 이루어나갈 수 있습니다."
            ],
            "땅": [
                "발 밑이 든든하게 다져지는 안정적인 하루입니다. 기반을 다지는 데 집중하세요.",
                "지나친 보수성은 새로운 기회를 놓치게 만들 수 있으니 가끔은 시야를 넓혀보세요.",
                "노력한 만큼의 확실한 결실이나 주변의 인정이 따르는 보람찬 날입니다."
            ],
            "바람": [
                "예상치 못한 변화나 새로운 아이디어가 번뜩이는 자유로운 하루입니다.",
                "마음이 쉽게 산만해질 수 있으니 한 번에 한 가지 목표에만 집중하는 것이 좋습니다.",
                "새로운 사람과의 만남이나 가벼운 외출 속에서 활력을 얻을 수 있습니다."
            ]
        };

        document.getElementById('fortuneForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const element = document.getElementById('element').value;
            
            // 선택한 원소의 운세 리스트 중 무작위 1개 선택
            const elementFortunes = fortunes[element];
            const randomFortune = elementFortunes[Math.floor(Math.random() * elementFortunes.length)];

            const resultDiv = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultText = document.getElementById('resultText');

            resultTitle.innerText = `${name}님의 [${element}] 원소 운세`;
            resultText.innerText = randomFortune;
            resultDiv.style.display = 'block';
        });
    </script>

</body>
</html>
