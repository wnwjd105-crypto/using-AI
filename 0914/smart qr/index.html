<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QR</title>
    <!-- QRCode.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            /* 마우스 움직임에 따라 변하는 동적 그라데이션 배경 기본값 */
            background: linear-gradient(135deg, #fbc531, #ff9f43, #ee5253);
            background-size: 200% 200%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            color: #333;
            transition: background 0.1s ease-out;
        }
        /* 상단 헤더 영역 */
        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        .logo-container img {
            height: 38px;
            width: auto;
            object-fit: contain;
        }
        .site-title {
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        /* 메인 컨테이너 */
        .main-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* 입력 카드 섹션 */
        .input-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            transition: all 0.5s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .input-section h2 {
            margin-bottom: 15px;
            font-size: 20px;
            color: #2c3e50;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="url"] {
            flex-grow: 1;
            padding: 14px 18px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fdfdfd;
            transition: all 0.2s;
        }
        input[type="url"]:focus {
            border-color: #ff6b6b;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.15);
        }
        button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(238, 82, 83, 0.3);
        }
        button:hover {
            opacity: 0.95;
        }
        button:active {
            transform: scale(0.97);
        }
        /* QR 코드 출력 영역 */
        .qr-section {
            margin-top: 25px;
            text-align: center;
            display: none;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .qr-section.show {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 1;
            transform: translateY(0);
        }
        .qr-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-bottom: 15px;
        }
        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #qrcode img {
            display: block;
            border-radius: 8px;
        }
        /* 별도로 분리된 다운로드 버튼 스타일 */
        .download-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #10ac84, #1dd1a1);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(29, 209, 161, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }
        .download-btn:hover {
            opacity: 0.95;
        }
        .download-btn:active {
            transform: scale(0.97);
        }
        /* 푸터 */
        footer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            padding: 10px 0;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="site-title">Smart QR</div>
    </header>

    <!-- 메인 컨테이너 -->
    <div class="main-container" id="mainContainer">
        <div class="input-section" id="inputSection">
            <h2>변환할 주소를 입력하세요</h2>
            <div class="input-group">
                <input type="url" id="urlInput" placeholder="https://example.com" required>
                <button id="generateBtn">확인</button>
            </div>
        </div>

        <div class="qr-section" id="qrSection">
            <div class="qr-card">
                <div id="qrcode"></div>
            </div>
            <!-- 다운로드 버튼을 별도로 독립 -->
            <button class="download-btn" id="downloadBtn">📥 JPG 파일 다운로드</button>
        </div>
    </div>

    <footer>
        &copy; Smart QR Generator. All rights reserved.
    </footer>

    <script>
        // 1. 마우스 위치에 따른 그라데이션 색상 변경 인터랙션
        document.addEventListener('mousemove', (e) => {
            const xPercent = (e.clientX / window.innerWidth) * 100;
            const yPercent = (e.clientY / window.innerHeight) * 100;

            // 마우스 위치에 따라 그라데이션 컬러톤과 각도 조절
            document.body.style.background = `linear-gradient(${xPercent}deg, #ff9a9e 0%, #fad0c4 ${yPercent}%, #fad0c4 100%)`;
        });

        const generateBtn = document.getElementById('generateBtn');
        const urlInput = document.getElementById('urlInput');
        const inputSection = document.getElementById('inputSection');
        const qrSection = document.getElementById('qrSection');
        const qrContainer = document.getElementById('qrcode');
        const mainContainer = document.getElementById('mainContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        let qrCodeInstance = null;

        generateBtn.addEventListener('click', makeQRCode);
        urlInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                makeQRCode();
            }
        });

        function makeQRCode() {
            const url = urlInput.value.trim();
            if (!url) {
                alert('URL을 입력해 주세요.');
                urlInput.focus();
                return;
            }

            // 기존 QR코드 초기화 후 생성
            qrContainer.innerHTML = '';
            qrCodeInstance = new QRCode(qrContainer, {
                text: url,
                width: 200,
                height: 200,
                colorDark: "#2d3436",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // 상단으로 자연스럽게 이동하며 QR 및 다운로드 버튼 노출
            mainContainer.style.justifyContent = 'flex-start';
            inputSection.style.marginTop = '20px';
            qrSection.classList.add('show');
        }

        // 별도로 분리된 다운로드 버튼 클릭 이벤트
        downloadBtn.addEventListener('click', function() {
            const img = qrContainer.querySelector('img');
            const canvasTag = qrContainer.querySelector('canvas');

            let imageUrl = '';
            if (img && img.src) {
                imageUrl = img.src;
            } else if (canvasTag) {
                imageUrl = canvasTag.toDataURL('image/jpeg');
            }

            if (!imageUrl) return;

            const downloadLink = document.createElement('a');
            downloadLink.href = imageUrl;
            downloadLink.download = 'smart_qr_code.jpg';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        });
    </script>
</body>
</html>
