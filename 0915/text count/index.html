<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자수 및 바이트 계산기</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            resize: vertical;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            text-align: center;
        }
        .stat-box.bytes {
            border-left-color: #e67e22;
        }
        .stat-title {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>글자수 / 바이트 계산기</h2>
        <div class="form-group">
            <textarea id="textInput" placeholder="텍스트를 입력하세요..."></textarea>
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-title">공백 포함 글자수</div>
                <div class="stat-value" id="charCount">0자</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">공백 제외 글자수</div>
                <div class="stat-value" id="charNoSpaceCount">0자</div>
            </div>
            <div class="stat-box bytes">
                <div class="stat-title">바이트 (한글 2byte)</div>
                <div class="stat-value" id="byteCount">0 byte</div>
            </div>
            <div class="stat-box bytes">
                <div class="stat-title">공백 제외 바이트</div>
                <div class="stat-value" id="byteNoSpaceCount">0 byte</div>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const charCountEl = document.getElementById('charCount');
        const charNoSpaceCountEl = document.getElementById('charNoSpaceCount');
        const byteCountEl = document.getElementById('byteCount');
        const byteNoSpaceCountEl = document.getElementById('byteNoSpaceCount');

        // 한글 여부 확인 함수 (완성형 한글 및 자모 범위)
        function isKorean(char) {
            const code = char.charCodeAt(0);
            return (code >= 0xAC00 && code <= 0xD7A3) || (code >= 0x3131 && code <= 0x318E);
        }

        function calculate() {
            const text = textInput.value;
            const textNoSpace = text.replace(/\s/g, '');

            // 글자수
            const charCount = text.length;
            const charNoSpaceCount = textNoSpace.length;

            // 바이트 계산 (한글 2바이트, 그 외 1바이트 규칙 적용)
            let byteCount = 0;
            for (let i = 0; i < text.length; i++) {
                if (isKorean(text[i])) {
                    byteCount += 2;
                } else {
                    byteCount += 1;
                }
            }

            let byteNoSpaceCount = 0;
            for (let i = 0; i < textNoSpace.length; i++) {
                if (isKorean(textNoSpace[i])) {
                    byteNoSpaceCount += 2;
                } else {
                    byteNoSpaceCount += 1;
                }
            }

            charCountEl.innerText = `${charCount}자`;
            charNoSpaceCountEl.innerText = `${charNoSpaceCount}자`;
            byteCountEl.innerText = `${byteCount} byte`;
            byteNoSpaceCountEl.innerText = `${byteNoSpaceCount} byte`;
        }

        textInput.addEventListener('input', calculate);
    </script>

</body>
</html>
