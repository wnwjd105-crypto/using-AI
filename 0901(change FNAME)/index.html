<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모임 설문조사 - 파스텔 테마</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fff8f4;
    }
    .survey-card {
      border-radius: 32px;
      box-shadow: 0 10px 30px rgba(255, 159, 67, 0.1);
    }
    .radio-card {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 2px solid transparent;
    }
    .radio-card:hover {
      transform: scale(1.02);
      background-color: #fff2e6;
    }
    input[type="radio"]:checked + .radio-content {
      font-weight: 700;
    }
    .radio-card:has(input[type="radio"]:checked) {
      border-color: #ff9f43;
      background-color: #fff2e6;
      transform: scale(1.03);
    }
    .submit-btn {
      transition: all 0.2s ease;
    }
    .submit-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 159, 67, 0.3);
    }
    .submit-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
  <div class="survey-card bg-white max-w-lg w-full overflow-hidden relative border-t-8 border-[#ff9f43]">
    
    <!-- 설문 입력 화면 -->
    <div class="p-8 md:p-10" id="formView">
      <div class="text-center mb-10">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">오늘 뭐 먹고 놀까? 🥳</h1>
        <p class="text-slate-500">의견을 수렴하여 최종 일정을 결정합니다.</p>
      </div>

      <form id="surveyForm" onsubmit="handleFormSubmit(event)" class="space-y-8">
        <!-- 질문 1: 주관식 이름 -->
        <div class="space-y-3">
          <label class="block text-lg font-semibold text-slate-700" for="userName">
            1. 본인의 이름을 입력해 주세요. <span class="text-orange-400">*</span>
          </label>
          <input type="text" id="userName" required placeholder="홍길동" class="w-full px-5 py-4 text-base border-2 border-slate-100 rounded-2xl outline-none focus:border-orange-300 transition-colors bg-slate-50/50">
        </div>

        <!-- 질문 2: 객관식 점심 -->
        <div class="space-y-4">
          <span class="block text-lg font-semibold text-slate-700">2. 오늘 점심으로 가장 당기는 메뉴는? 🍱</span>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer relative overflow-hidden">
              <input type="radio" name="lunch" value="한식 (찌개/백반)" required class="hidden">
              <span class="radio-content text-slate-600">한식 (찌개/백반)</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="lunch" value="일식 (돈까스/라멘)" class="hidden">
              <span class="radio-content text-slate-600">일식 (돈까스/라멘)</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="lunch" value="양식 (파스타/버거)" class="hidden">
              <span class="radio-content text-slate-600">양식 (파스타/버거)</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="lunch" value="간편식 (샌드위치/샐러드)" class="hidden">
              <span class="radio-content text-slate-600">간편식 (샌드위치/샐러드)</span>
            </label>
          </div>
        </div>

        <!-- 질문 3: 객관식 저녁 -->
        <div class="space-y-4">
          <span class="block text-lg font-semibold text-slate-700">3. 저녁 식사/회식 메뉴는 어떤 게 좋을까요? 🍻</span>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="dinner" value="삼겹살/소고기" required class="hidden">
              <span class="radio-content text-slate-600">삼겹살/소고기</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="dinner" value="치킨/피자" class="hidden">
              <span class="radio-content text-slate-600">치킨/피자</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="dinner" value="이자카야/요리주점" class="hidden">
              <span class="radio-content text-slate-600">이자카야/요리주점</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="dinner" value="술 없는 맛집 탐방" class="hidden">
              <span class="radio-content text-slate-600">술 없는 맛집 탐방</span>
            </label>
          </div>
        </div>

        <!-- 질문 4: 객관식 뒤풀이 -->
        <div class="space-y-4">
          <span class="block text-lg font-semibold text-slate-700">4. 식사 후 놀 장소나 뒤풀이는 어디가 좋을까요? 🎳</span>
          <div class="space-y-3">
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="activity" value="보드게임 카페" required class="hidden">
              <span class="radio-content text-slate-600 text-center w-full">보드게임 카페</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="activity" value="볼링/당구/스크린스포츠" class="hidden">
              <span class="radio-content text-slate-600 text-center w-full">볼링/당구/스크린스포츠</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="activity" value="분위기 좋은 대형 카페" class="hidden">
              <span class="radio-content text-slate-600 text-center w-full">분위기 좋은 대형 카페</span>
            </label>
            <label class="radio-card flex items-center p-4 bg-slate-50 rounded-2xl cursor-pointer">
              <input type="radio" name="activity" value="바로 귀가/자유 해산" class="hidden">
              <span class="radio-content text-slate-600 text-center w-full">바로 귀가/자유 해산</span>
            </label>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn w-full py-5 text-lg font-bold text-white bg-[#ff9f43] rounded-2xl shadow-lg shadow-orange-100 disabled:opacity-50 disabled:cursor-not-allowed">
          제출하기 🚀
        </button>
      </form>
    </div>

    <!-- 제출 완료 화면 -->
    <div id="completeView" class="hidden p-12 text-center">
      <div class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-3">설문 응답이 제출되었습니다!</h2>
      <p class="text-slate-500">소중한 의견 감사합니다. 곧 즐거운 모임에서 만나요!</p>
    </div>

  </div>

  <script>
    function handleFormSubmit(event) {
      event.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = '제출 중...';

      // 라디오 버튼 선택값 추출
      const nameVal = document.getElementById('userName').value.trim();
      const lunchVal = document.querySelector('input[name="lunch"]:checked').value;
      const dinnerVal = document.querySelector('input[name="dinner"]:checked').value;
      const activityVal = document.querySelector('input[name="activity"]:checked').value;

      const formData = {
        name: nameVal,
        lunch: lunchVal,
        dinner: dinnerVal,
        activity: activityVal
      };

      // GAS 백엔드 전송
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(function(response) {
            if (response.success) {
              document.getElementById('formView').classList.add('hidden');
              document.getElementById('completeView').classList.remove('hidden');
            } else {
              alert('저장 실패: ' + response.error);
              submitBtn.disabled = false;
              submitBtn.innerText = '제출하기 🚀';
            }
          })
          .withFailureHandler(function(error) {
            alert('네트워크 또는 시스템 오류: ' + error);
            submitBtn.disabled = false;
            submitBtn.innerText = '제출하기 🚀';
          })
          .submitSurvey(formData);
      }
    }
  </script>
</body>
</html>
