<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자리비움 안내 화면</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        /* 입력 폼 화면 */
        .setup-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            color: #333;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .setup-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }
        input[type="text"],
        input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #6a11cb;
        }
        button.confirm-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.4);
            transition: transform 0.1s, opacity 0.2s;
        }
        button.confirm-btn:hover {
            opacity: 0.9;
        }
        button.confirm-btn:active {
            transform: scale(0.98);
        }

        /* 애니메이션 그라데이션 디스플레이 화면 */
        .display-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index: 20;
        }
        .display-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .away-card {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 60px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .schedule-text {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 25px;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            word-break: keep-all;
        }

        .return-info {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: 500;
            color: #f1f2f6;
        }

        .countdown-timer {
            font-size: 32px;
            font-weight: 700;
            color: #00ffcc;
            margin-bottom: 30px;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .message-text {
            font-size: 18px;
            color: #dfe4ea;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 12px;
            display: inline-block;
            word-break: keep-all;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- 입력 폼 화면 -->
    <div class="setup-container" id="setupContainer">
        <h2>자리비움 안내 설정</h2>
        <form id="awayForm">
            <div class="form-group">
                <label for="schedule">일정 입력</label>
                <input type="text" id="schedule" required placeholder="예: 외부 미팅 중 / 점심 식사 / 회의 중">
            </div>

            <div class="form-group">
                <label for="returnTime">복귀 예정 시간</label>
                <input type="datetime-local" id="returnTime" required>
            </div>

            <div class="form-group">
                <label for="message">기타 안내 문구</label>
                <input type="text" id="message" placeholder="예: 급한 연락은 메신저로 남겨주세요.">
            </div>

            <button type="submit" class="confirm-btn">안내 화면 시작하기</button>
        </form>
    </div>

    <!-- 애니메이션 그라데이션 디스플레이 화면 -->
    <div class="display-screen" id="displayScreen">
        <button class="back-btn" id="backBtn">설정으로 돌아가기</button>
        <div class="away-card">
            <div class="schedule-text" id="dispSchedule">외부 미팅 중</div>
            <div class="return-info" id="dispReturnTime">복귀 예정: 2026-09-14 14:00</div>
            <div class="countdown-timer" id="dispCountdown">남은 시간: 계산 중...</div>
            <div class="message-text" id="dispMessage">급한 연락은 메신저로 남겨주세요.</div>
        </div>
    </div>

    <script>
        const awayForm = document.getElementById('awayForm');
        const setupContainer = document.getElementById('setupContainer');
        const displayScreen = document.getElementById('displayScreen');
        const backBtn = document.getElementById('backBtn');

        const dispSchedule = document.getElementById('dispSchedule');
        const dispReturnTime = document.getElementById('dispReturnTime');
        const dispCountdown = document.getElementById('dispCountdown');
        const dispMessage = document.getElementById('dispMessage');

        let countdownInterval = null;
        let targetDateObj = null;

        // 현재 시간 기준으로 datetime-local 기본값 설정
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('returnTime').value = now.toISOString().slice(0, 16);
        });

        awayForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const schedule = document.getElementById('schedule').value;
            const returnTimeVal = document.getElementById('returnTime').value;
            const message = document.getElementById('message').value;

            if (!returnTimeVal) return;

            targetDateObj = new Date(returnTimeVal);

            dispSchedule.innerText = schedule;
            
            const options = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' };
            dispReturnTime.innerText = `복귀 예정: ${targetDateObj.toLocaleString('ko-KR', options)}`;
            
            dispMessage.innerText = message ? message : '안내 사항이 없습니다.';
            dispMessage.style.display = message ? 'inline-block' : 'none';

            // 화면 전환
            setupContainer.style.opacity = '0';
            setTimeout(() => {
                setupContainer.style.display = 'none';
                displayScreen.classList.add('active');
                startCountdown();
            }, 500);
        });

        backBtn.addEventListener('click', function() {
            displayScreen.classList.remove('active');
            setupContainer.style.display = 'block';
            setTimeout(() => {
                setupContainer.style.opacity = '1';
            }, 50);

            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
        });

        function startCountdown() {
            updateTimer();
            countdownInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            const now = new Date();
            const diff = targetDateObj - now;

            if (diff <= 0) {
                dispCountdown.innerText = "⏰ 복귀 시간이 지났거나 곧 도착합니다!";
                clearInterval(countdownInterval);
                return;
            }

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            let timeString = "남은 시간: ";
            if (hours > 0) {
                timeString += `${hours}시간 `;
            }
            timeString += `${String(minutes).padStart(2, '0')}분 ${String(seconds).padStart(2, '0')}초`;
            
            dispCountdown.innerText = timeString;
        }
    </script>
</body>
</html>
